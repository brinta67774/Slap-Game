<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>চড় গেম</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7f2;--card:#ffffff;--text:#2a1a14;--muted:#7a625a;--accent:#d62828;--accent-text:#ffffff;--border:#f0d9cf;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1210;--card:#271a16;--text:#f6e9e3;--muted:#b69d94;--accent:#ef476f;--border:#3d2a24}}
:root[data-theme="dark"]{--bg:#1a1210;--card:#271a16;--text:#f6e9e3;--muted:#b69d94;--accent:#ef476f;--border:#3d2a24}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Hind Siliguri',system-ui,'Noto Sans Bengali',sans-serif;min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:480px;padding:16px;display:flex;flex-direction:column;gap:12px;align-items:center}
h1{margin:4px 0 0;font-size:1.6rem;text-align:center}
.sub{margin:0;color:var(--muted);text-align:center;font-size:.95rem}
.hud{display:flex;gap:10px;width:100%}
.box{flex:1;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:8px;text-align:center}
.box b{display:block;font-size:1.8rem;line-height:1.1}
.box span{font-size:.8rem;color:var(--muted)}
.stage{position:relative;width:min(82vw,360px);aspect-ratio:1;border-radius:24px;overflow:hidden;background:var(--card);border:2px solid var(--border);touch-action:manipulation;user-select:none;-webkit-user-select:none;cursor:pointer}
.stage img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none;transition:transform .08s ease-out}
.stage.off{cursor:default;filter:grayscale(.4)}
.mark{position:absolute;width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;background:radial-gradient(circle,rgba(214,40,40,.65),rgba(214,40,40,0) 70%);pointer-events:none;animation:fade .7s forwards}
.hand{position:absolute;font-size:56px;margin:-34px 0 0 -28px;pointer-events:none;animation:hit .35s forwards}
.plus{position:absolute;font-weight:700;font-size:1.3rem;color:#fff;text-shadow:0 1px 4px #000;pointer-events:none;animation:up .7s forwards}
@keyframes fade{to{opacity:0;transform:scale(1.3)}}
@keyframes hit{0%{transform:scale(1.6) rotate(-25deg);opacity:0}30%{opacity:1}100%{transform:scale(1) rotate(10deg);opacity:0}}
@keyframes up{to{transform:translateY(-50px);opacity:0}}
.overlay{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(0,0,0,.6);color:#fff;text-align:center;padding:16px}
.overlay.show{display:flex}
.overlay h2{margin:0;font-size:1.5rem}
.overlay p{margin:0}
button,.file{font-family:inherit;font-size:1.05rem;font-weight:600;border:0;border-radius:12px;padding:12px 22px;cursor:pointer}
.primary{background:var(--accent);color:var(--accent-text)}
.secondary{background:var(--card);color:var(--text);border:1px solid var(--border)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
input[type=file]{display:none}
.note{font-size:.8rem;color:var(--muted);text-align:center;margin:0}
</style>
</head>
<body>
<div class="app">
  <h1>✋চড় গেম✋</h1>
  <p class="sub">১ যত পারো চড় মারো!</p>
  <div class="hud">
    <div class="box"><b id="score">0</b><span>চড়</span></div>
    <div class="box"><b id="time">60</b><span>সেকেন্ড</span></div>
    <div class="box"><b id="best">0</b><span>সেরা স্কোর</span></div>
  </div>
  <div class="stage off" id="stage">
    <img id="enemy" alt="শত্রুর ছবি">
    <div class="overlay show" id="overlay">
      <h2 id="ovTitle">প্রস্তুত?</h2>
      <p id="ovText">শুরু চাপলেই ৬০ সেকেন্ডের টাইমার চলবে।</p>
      <button class="primary" id="startBtn">শুরু করো</button>
    </div>
  </div>
  <p class="note">চড় মেরে মন না ভরলে, প্রয়োজনে পুনরায় চড় মারো! 😏</p>
</div>
<script>
(function(){
  var ADMIN_IMAGE='photo2.jpg'; //change photo.jpg to your own image file name in the same folder if you want a custom default image
  var $=function(id){return document.getElementById(id)};
  var stage=$('stage'),img=$('enemy'),overlay=$('overlay'),scoreEl=$('score'),timeEl=$('time'),bestEl=$('best');
  var score=0,best=0,left=60,playing=false,timer=null,endAt=0,ctx=null,noiseBuf=null;
  img.src=ADMIN_IMAGE;

  try{best=parseInt(localStorage.getItem('slapBest')||'0',10)||0}catch(e){}
  bestEl.textContent=best;

  function initAudio(){
    if(!ctx){
      var AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return;
      ctx=new AC();
      noiseBuf=ctx.createBuffer(1,ctx.sampleRate*0.5,ctx.sampleRate);
      var d=noiseBuf.getChannelData(0);
      for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    }
    if(ctx.state==='suspended')ctx.resume();
  }

  function slapSound(){
    if(!ctx)return;
    var t=ctx.currentTime,master=ctx.createGain();
    master.gain.value=0.85;master.connect(ctx.destination);
    // sharp crack
    var n1=ctx.createBufferSource();n1.buffer=noiseBuf;
    var hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=2500+Math.random()*1500;
    var g1=ctx.createGain();g1.gain.setValueAtTime(1,t);g1.gain.exponentialRampToValueAtTime(0.001,t+0.04);
    n1.connect(hp);hp.connect(g1);g1.connect(master);n1.start(t,Math.random()*0.3,0.06);
    // skin smack body
    var n2=ctx.createBufferSource();n2.buffer=noiseBuf;
    var bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=900+Math.random()*900;bp.Q.value=0.9;
    var g2=ctx.createGain();g2.gain.setValueAtTime(0.9,t);g2.gain.exponentialRampToValueAtTime(0.001,t+0.14);
    n2.connect(bp);bp.connect(g2);g2.connect(master);n2.start(t,Math.random()*0.3,0.18);
    // low thump
    var o=ctx.createOscillator();o.type='sine';
    var f0=170+Math.random()*50;
    o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(55,t+0.12);
    var g3=ctx.createGain();g3.gain.setValueAtTime(0.9,t);g3.gain.exponentialRampToValueAtTime(0.001,t+0.15);
    o.connect(g3);g3.connect(master);o.start(t);o.stop(t+0.2);
  }

  function spawn(cls,x,y,text){
    var el=document.createElement('div');el.className=cls;
    el.style.left=x+'px';el.style.top=y+'px';
    if(text)el.textContent=text;
    stage.appendChild(el);
    setTimeout(function(){el.remove()},800);
  }

  function slap(e){
    if(!playing)return;
    e.preventDefault();
    var r=stage.getBoundingClientRect();
    var x=e.clientX-r.left,y=e.clientY-r.top;
    score++;scoreEl.textContent=score;
    slapSound();
    spawn('mark',x,y);spawn('hand',x,y,'🖐️');spawn('plus',x,y-20,'+1');
    var dir=x<r.width/2?1:-1; // face turns away from the hit side
    img.style.transform='rotate('+(dir*(6+Math.random()*5))+'deg) translateX('+(dir*14)+'px) scale(1.04)';
    setTimeout(function(){img.style.transform=''},90);
    if(navigator.vibrate)try{navigator.vibrate(25)}catch(_){}
  }
  stage.addEventListener('pointerdown',slap);

  function tick(){
    left=Math.max(0,Math.ceil((endAt-Date.now())/1000));
    timeEl.textContent=left;
    if(left<=0)finish();
  }

  function start(){
    initAudio();
    score=0;scoreEl.textContent=0;left=60;timeEl.textContent=60;
    playing=true;stage.classList.remove('off');overlay.classList.remove('show');
    endAt=Date.now()+60000;
    clearInterval(timer);timer=setInterval(tick,100);
  }

  function finish(){
    clearInterval(timer);playing=false;stage.classList.add('off');
    var newBest=score>best;
    if(newBest){
      best=score;bestEl.textContent=best;
      try{localStorage.setItem('slapBest',String(best))}catch(e){}
    }
    $('ovTitle').textContent='সময় শেষ!';
    $('ovText').textContent='তোমার স্কোর: '+score+' চড়'+(newBest?' 🎉 নতুন রেকর্ড!':'');
    $('startBtn').textContent='আবার খেলো';
    overlay.classList.add('show');
  }

  $('startBtn').addEventListener('click',start);

})();
</script>
</body>
</html>
